name: replication

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: replication/requirements-lock.txt
      - name: Install pinned dependencies
        run: python -m pip install -r replication/requirements-lock.txt
      - name: Original symbolic certificate (unmodified, assertions enabled)
        run: |
          start=$(date +%s.%N)
          python epistemic_holonomy_certificate.py | tee certificate_stdout.txt
          echo "certificate wall seconds: $(echo "$(date +%s.%N) - $start" | bc)"
          diff certificate_stdout.txt replication/results/certificate_stdout.txt
      - name: Regression tests (independent density-matrix implementation)
        run: python -m pytest replication/tests -v --durations=10
      - name: Reduced end-to-end run and figures
        run: |
          python replication/run_all.py --quick --out ci_results --only ideal sweeps maps misc
          python replication/make_figures.py --results ci_results --out ci_figures
      - uses: actions/upload-artifact@v4
        with:
          name: quick-run
          path: |
            ci_results
            ci_figures
            certificate_stdout.txt
